  # ── Custom: known organization names (exact match, zero false positives) ──
  # Add your client/company names here. This is the high-precision
  # complement to spaCy NER ORG detection (which is enabled in nlp.yaml but
  # noisy). Names are matched case-insensitively at word boundaries.
  - name: "Known organizations"
    supported_languages:
      - en
      - ru
    supported_entity: "ORGANIZATION"
    type: custom
    deny_list_score: 0.9
    deny_list:
      - Novartis
      - Roche
      - Pfizer
      - AstraZeneca
      - Acme Corporation

  # ── Custom: secrets (API keys, tokens, private keys, passwords) ──
  # One entity type, SECRET, so Palena renders <SECRET_n>. Regexes are adapted
  # from gitleaks' default ruleset (https://github.com/gitleaks/gitleaks,
  # config/gitleaks.toml: aws-access-token, github-pat, github-oauth,
  # github-fine-grained-pat, openai-api-key, anthropic-api-key, slack-*,
  # jwt, private-key, generic-api-key). Specific shapes score 0.95, generic
  # `name=value` assignments 0.75 (Palena's default threshold is 0.7).
  # Note global_regex_flags=26 includes IGNORECASE; (?-i:...) pins case.
  - name: "Secrets"
    supported_languages:
      - en
      - ru
    supported_entity: "SECRET"
    type: custom
    patterns:
      - name: aws_access_key_id
        # gitleaks aws-access-token; {16,} (not {16}) also masks over-long look-alikes
        regex: '\b(?-i:(?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16,})\b'
        score: 0.95
      - name: aws_secret_access_key
        regex: '\baws_?secret_?(?:access_?)?key["'']?\s*[=:]\s*["'']?[A-Za-z0-9/+=]{40}'
        score: 0.95
      - name: github_token
        # gitleaks github-pat / github-oauth / github-app-token / github-refresh-token
        regex: '\b(?-i:gh[pousr]_[A-Za-z0-9]{36,255})\b'
        score: 0.95
      - name: github_fine_grained_pat
        regex: '\b(?-i:github_pat_[A-Za-z0-9_]{22,255})\b'
        score: 0.95
      - name: openai_anthropic_key
        # sk-..., sk-proj-..., sk-ant-api03-... (openai-api-key / anthropic-api-key)
        regex: '\b(?-i:sk-(?:ant-|proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,})'
        score: 0.95
      - name: slack_token
        regex: '\b(?-i:xox[abeprs]-[A-Za-z0-9-]{10,})'
        score: 0.95
      - name: jwt
        regex: '\b(?-i:eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,})'
        score: 0.95
      - name: pem_private_key
        # whole block; also a header with a truncated/missing footer
        regex: '-----BEGIN[ A-Z]*PRIVATE KEY(?: BLOCK)?-----(?:.*?-----END[ A-Z]*PRIVATE KEY(?: BLOCK)?-----|[A-Za-z0-9+/=\s]{20,})'
        score: 0.98
      - name: generic_assignment
        # password=..., token: ..., api_key="..." (value >= 8 chars, no spaces)
        regex: '\b[\w.-]*(?:password|passwd|pwd|secret|token|api[_-]?key|apikey|access[_-]?key|private[_-]?key|client[_-]?secret)["'']?\s*(?:=|:=|:)\s*["'']?[^\s"'',;<>()]{8,}'
        score: 0.75

  # ── Custom: Russian short/diminutive first names (spaCy ru misses "Коля") ──
  # Stem + case ending (Коля, Коли, Коле, Колю, Колей). Whole-word, Cyrillic only.
  - name: "Russian short names"
    supported_languages:
      - ru
    supported_entity: "PERSON"
    type: custom
    patterns:
      - name: ru_diminutive
        regex: '(?<![а-яёa-z])(?-i:Коля|Коли|Коле|Колю|Колей|Саша|Саши|Саше|Сашу|Сашей|Петя|Пети|Пете|Петю|Петей|Вася|Васи|Васе|Васю|Васей|Миша|Миши|Мише|Мишу|Мишей|Дима|Димы|Диме|Диму|Димой|Ваня|Вани|Ване|Ваню|Ваней|Женя|Жени|Жене|Женю|Женей|Серёжа|Серёжи|Серёже|Серёжу|Серёжей|Сергей|Андрюша|Андрюши|Андрюше|Андрюшу|Лёша|Лёши|Лёше|Лёшу|Лёшей|Паша|Паши|Паше|Пашу|Пашей|Гена|Гены|Гене|Гену|Геной|Витя|Вити|Вите|Витю|Витей)(?![а-яёa-z])'
        score: 0.95
